[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "joymesh"
version = "0.1.0"
description = "A local control plane for discovering, routing, and supervising coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "JoyMesh contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "cryptography>=48.0.1,<49",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
joymesh = "joymesh.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/joymesh"]

[tool.hatch.build.targets.sdist]
exclude = ["/frontend"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["joymesh"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*"]
ignore_missing_imports = true
